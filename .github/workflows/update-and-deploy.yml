name: Update standings and deploy

on:
  workflow_dispatch:
schedule:
  # Daily morning refresh
  - cron: "17 11 * * *"

  # Saturdays: every 30 minutes, roughly noon-midnight ET
  - cron: "17,47 16-23 * * 6"
  - cron: "17,47 0-3 * * 0"

  # Sundays: every 30 minutes, roughly noon-midnight ET
  - cron: "23,53 16-23 * * 0"
  - cron: "23,53 0-3 * * 1"

  # Monday and Thursday evening NFL
  - cron: "27,57 23 * * 1,4"
  - cron: "27,57 0-3 * * 2,5"
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install updater dependency
        run: pip install requests

      - name: Refresh standings
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python scripts/update_scores.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
