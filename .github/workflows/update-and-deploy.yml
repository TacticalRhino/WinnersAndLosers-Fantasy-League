name: Update standings and deploy

on:
  workflow_dispatch:

  schedule:
    # Daily morning refresh
    - cron: "17 7 * * *"
      timezone: "America/New_York"

    # Saturday game window: 12:17 PM–11:47 PM ET
    - cron: "17,47 12-23 * * 6"
      timezone: "America/New_York"

    # Sunday game window
    - cron: "23,53 12-23 * * 0"
      timezone: "America/New_York"

    # Monday Night Football
    - cron: "27,57 19-23 * * 1"
      timezone: "America/New_York"

    # Thursday Night Football
    - cron: "27,57 19-23 * * 4"
      timezone: "America/New_York"
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install updater dependency
        run: pip install requests

      - name: Refresh standings
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python scripts/update_scores.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
